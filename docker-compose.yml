services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aicms_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aicms_user
      POSTGRES_PASSWORD: aicms_password
      POSTGRES_DB: aicms_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicms_user -d aicms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aicms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicms_backend
    restart: unless-stopped
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app/backend
      - ./evidence:/app/evidence
      - uploaded_data:/app/backend/storage/uploads
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://aicms_user:aicms_password@db:5432/aicms_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_DIR=/app/backend/storage/uploads
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost:443,https://localhost
      - EMBEDDER=stub
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicms_worker
    restart: unless-stopped
    command: ["celery", "-A", "backend.app.workers.celery_app", "worker", "-l", "info"]
    volumes:
      - ./backend:/app/backend
      - uploaded_data:/app/backend/storage/uploads
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://aicms_user:aicms_password@db:5432/aicms_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_DIR=/app/backend/storage/uploads
      - EMBEDDER=stub
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicms_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: aicms_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  uploaded_data:
