name: CI Pipeline

on:
  push:
    branches: [ main, feature/*, milestone/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aicms_user
          POSTGRES_PASSWORD: aicms_password
          POSTGRES_DB: aicms_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 backend --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics

      - name: Initialize PostgreSQL pgvector extension
        run: |
          python -c "import asyncio, asyncpg; asyncio.run((lambda: asyncpg.connect('postgresql://aicms_user:aicms_password@localhost:5432/aicms_db'))())" || true

      - name: Run Backend Unit & Integration Tests with Coverage
        env:
          DATABASE_URL: postgresql+asyncpg://aicms_user:aicms_password@localhost:5432/aicms_db
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          EMBEDDER: stub
          STORAGE_DIR: backend/storage/uploads
          ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/unit/ \
            --cov=app \
            --cov-branch \
            --cov-report=xml:../coverage.xml \
            --cov-report=html:../docs/reports/coverage_html \
            --cov-report=term-missing \
            --junitxml=../junit.xml

      - name: Upload Test Results & Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            junit.xml
            coverage.xml
            docs/reports/coverage_html/

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build
